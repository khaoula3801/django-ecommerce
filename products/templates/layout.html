<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-commerce{% endblock %}</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'products/style.css' %}">
    {% block stylesheet %}{% endblock %}
</head>
<body>
    <nav class="navbar-pastel">
        <a class="navbar-logo" href="{% url 'home' %}">E-Shop</a>
        <div class="navbar-links">
            <a href="{% url 'home' %}">Accueil</a>
            <a href="{% url 'product_list' %}">Produits</a>
            <a href="{% url 'cart' %}">Panier</a>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">Profil</a>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Déconnexion</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Connexion</a>
                <a href="{% url 'signup' %}">Inscription</a>
            {% endif %}
        </div>
    </nav>

    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        Copyright © EMI 2026 — Projet Django E-commerce
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
